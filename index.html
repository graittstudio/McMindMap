<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McMindMap</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>window.__MCM_DEFER_BOOT__ = true;</script>
</head>
<body>
  <header id="toolbar">
    <button id="btn-maps" class="chrome" title="My mindmaps">☰ Maps</button>
    <span class="brand">McMindMap</span>
    <button id="map-title" class="map-title" title="Rename this mindmap">Untitled</button>
    <span id="save-state" class="save-state"></span>

    <div class="group">
      <button id="btn-add-child" title="Add branch (Tab)">+ Branch</button>
      <button id="btn-add-sibling" title="Add sibling (Enter)">+ Sibling</button>
      <button id="btn-delete" title="Delete branch (Del)">Delete</button>
      <button id="btn-image" title="Attach a picture to the selected branch">+ Image</button>
    </div>
    <div class="group">
      <label class="swatches" id="swatches" title="Branch colour"></label>
    </div>
    <div class="group">
      <button id="btn-fit" title="Fit to screen">Fit</button>
      <button id="btn-export">Export</button>
      <button id="btn-import">Import</button>
      <input type="file" id="file-input" accept="application/json" hidden />
      <input type="file" id="image-input" accept="image/*" hidden />
    </div>

    <div class="user-area">
      <button id="user-btn" class="chrome">
        <span class="avatar" id="user-avatar">?</span>
        <span id="user-name">…</span> ▾
      </button>
      <div id="user-menu" class="menu" hidden>
        <button data-act="prefs">Preferences</button>
        <button data-act="admin" id="menu-admin" hidden>Manage users</button>
        <button data-act="logout">Sign out</button>
      </div>
    </div>
  </header>

  <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
    <g id="viewport">
      <g id="branches"></g>
      <g id="nodes"></g>
    </g>
  </svg>

  <input id="editor" type="text" autocomplete="off" spellcheck="false" hidden />

  <!-- Maps drawer -->
  <aside id="maps-drawer" class="drawer" hidden>
    <header>
      <h2>My mindmaps</h2>
      <button id="drawer-close" class="icon">✕</button>
    </header>
    <button id="btn-new-map" class="primary">+ New mindmap</button>
    <ul id="maps-list"></ul>
  </aside>

  <!-- Preferences modal -->
  <div id="prefs-modal" class="modal" hidden>
    <div class="dialog">
      <header><h2>Preferences</h2><button class="icon close">✕</button></header>
      <label>Display name
        <input id="pref-name" type="text" />
      </label>
      <label>Theme
        <select id="pref-theme">
          <option value="paper">Paper</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <hr />
      <label>Change password (leave blank to keep)
        <input id="pref-current" type="password" autocomplete="current-password" placeholder="Current password" />
      </label>
      <input id="pref-newpw" type="password" autocomplete="new-password" placeholder="New password (min 8 chars)" />
      <p class="msg" id="prefs-msg"></p>
      <footer>
        <button class="ghost close">Cancel</button>
        <button id="prefs-save" class="primary">Save</button>
      </footer>
    </div>
  </div>

  <!-- Admin modal -->
  <div id="admin-modal" class="modal" hidden>
    <div class="dialog wide">
      <header><h2>Manage users</h2><button class="icon close">✕</button></header>
      <table id="users-table"><thead>
        <tr><th>User</th><th>Role</th><th>Name</th><th></th></tr>
      </thead><tbody></tbody></table>
      <hr />
      <h3>Add user</h3>
      <div class="row">
        <input id="nu-username" placeholder="username" />
        <select id="nu-role"><option value="user">user</option><option value="admin">admin</option></select>
        <input id="nu-name" placeholder="display name" />
        <input id="nu-pw" type="text" placeholder="temp password (min 8)" />
        <button id="nu-add" class="primary">Add</button>
      </div>
      <p class="msg" id="admin-msg"></p>
    </div>
  </div>

  <div id="overlay" hidden></div>

  <script src="js/app.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
