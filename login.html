<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McMindMap · Sign in</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b8860b" />
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=29" />
  <link rel="apple-touch-icon" href="icon.png?v=29" />
  <link rel="stylesheet" href="css/auth.css?v=7" />
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head>
<body>
  <svg class="bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M720 450 C 520 450 460 250 300 230" />
    <path d="M720 450 C 920 450 980 250 1140 230" stroke-dasharray="0" />
    <path d="M720 450 C 540 470 460 660 320 690" />
    <path d="M720 450 C 900 470 980 660 1120 690" />
  </svg>

  <main class="card">
    <div class="brand">
      <span class="dot"></span>
      <h1>McMindMap</h1>
    </div>
    <p class="tagline">Map your thinking — branch by branch.</p>

    <!-- Sign-in -->
    <form id="login-form" autocomplete="on">
      <label>Username or email
        <input id="username" name="username" type="text" autocomplete="username" required autofocus />
      </label>
      <label>Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <label class="show-pw"><input type="checkbox" id="login-show" /> Show password</label>
      <button type="submit" id="login-btn">Sign in</button>
      <p class="msg" id="login-msg"></p>
      <div class="links-row">
        <button type="button" id="forgot-link" class="linkish">Forgot password?</button>
        <button type="button" id="signup-link" class="linkish">Create account</button>
      </div>
    </form>

    <!-- Request a reset link -->
    <form id="reset-request-form" hidden>
      <p class="notice">Enter your username or email and we'll send you a link to reset your password.</p>
      <label>Email or username
        <input id="reset-login" type="text" autocomplete="username" required autofocus />
      </label>
      <button type="submit" id="reset-request-btn">Send reset link</button>
      <p class="msg" id="reset-request-msg"></p>
      <button type="button" id="back-to-login" class="linkish">Back to sign in</button>
    </form>

    <!-- Sign up -->
    <form id="signup-form" hidden autocomplete="on">
      <p class="notice">We'll email you a link to set your password.</p>
      <label>Your name
        <input id="signup-name" type="text" autocomplete="name" required autofocus />
      </label>
      <label>Email
        <input id="signup-email" type="email" autocomplete="email" required />
      </label>
      <button type="submit" id="signup-btn">Create account</button>
      <p class="msg" id="signup-msg"></p>
      <button type="button" id="signup-back" class="linkish">Back to sign in</button>
    </form>

    <!-- Forced password change -->
    <form id="change-form" hidden>
      <p class="notice">Welcome! Please choose a new password to continue.</p>
      <label>New password
        <input id="new-pw" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <label>Confirm new password
        <input id="new-pw2" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <label class="show-pw"><input type="checkbox" id="change-show" /> Show passwords</label>
      <button type="submit" id="change-btn">Set password &amp; continue</button>
      <p class="msg" id="change-msg"></p>
    </form>
  </main>

  <script src="js/auth.js?v=7"></script>
</body>
</html>
