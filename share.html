<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McMindMap · Open shared mindmap</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b8860b" />
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=35" />
  <link rel="apple-touch-icon" href="icon.png?v=35" />
  <link rel="stylesheet" href="css/auth.css?v=7" />
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head>
<body>
  <svg class="bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M720 450 C 520 450 460 250 300 230" />
    <path d="M720 450 C 920 450 980 250 1140 230" />
    <path d="M720 450 C 540 470 460 660 320 690" />
    <path d="M720 450 C 900 470 980 660 1120 690" />
  </svg>

  <main class="card">
    <div class="brand">
      <span class="dot"></span>
      <h1>McMindMap</h1>
    </div>

    <div id="share-loading">
      <p class="tagline">Looking up this share…</p>
    </div>

    <div id="share-accept" hidden>
      <p class="tagline">Someone shared a mindmap with you.</p>
      <div class="share-card">
        <p class="share-title" id="share-title-text"></p>
        <p class="share-meta">
          From <strong id="share-owner"></strong> · <span id="share-rights"></span>
        </p>
      </div>
      <button id="share-accept-btn">Accept and open</button>
      <p class="msg" id="share-msg"></p>
      <button type="button" id="share-decline" class="linkish">Not now</button>
    </div>

    <div id="share-error" hidden>
      <p class="tagline" id="share-error-msg">Something went wrong.</p>
      <a class="linkish" href="index.html">Back to McMindMap</a>
    </div>
  </main>

  <script src="js/share.js?v=1"></script>
</body>
</html>
