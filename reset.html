<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McMindMap · Reset password</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#b8860b" />
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=29" />
  <link rel="apple-touch-icon" href="icon.png?v=29" />
  <link rel="stylesheet" href="css/auth.css?v=7" />
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head>
<body>
  <svg class="bg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M720 450 C 520 450 460 250 300 230" />
    <path d="M720 450 C 920 450 980 250 1140 230" />
    <path d="M720 450 C 540 470 460 660 320 690" />
    <path d="M720 450 C 900 470 980 660 1120 690" />
  </svg>

  <main class="card">
    <div class="brand">
      <span class="dot"></span>
      <h1>McMindMap</h1>
    </div>
    <p class="tagline">Choose a new password.</p>

    <form id="reset-form">
      <label>New password
        <input id="new-pw" type="password" autocomplete="new-password" minlength="8" required autofocus />
      </label>
      <label>Confirm new password
        <input id="new-pw2" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <label class="show-pw"><input type="checkbox" id="reset-show" /> Show passwords</label>
      <button type="submit" id="reset-btn">Set new password</button>
      <p class="msg" id="reset-msg"></p>
      <a class="linkish" href="login.html">Back to sign in</a>
    </form>
  </main>

  <script src="js/reset.js?v=4"></script>
</body>
</html>
