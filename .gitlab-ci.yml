workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - lint
  - test
  - deploy

# ── Lint ────────────────────────────────────────────────────────────────────
# Static app: JS syntax check + sanity that the entry files exist.

lint:
  stage: lint
  script:
    - test -f index.html || (echo "index.html missing" && exit 1)
    - test -f login.html || (echo "login.html missing" && exit 1)
    - test -f share.html || (echo "share.html missing" && exit 1)
    - php --version
    - 'echo "PHP syntax check…"; for f in api/*.php tests/backend/*.php; do php -l "$f"; done'
    - 'if find . -name "*.db" -not -path "./.git/*" | grep -q .; then echo "DB file committed!"; exit 1; fi'
    - export NVM_DIR="$HOME/.nvm"; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" && nvm use 20 || true
    - 'for f in js/app.js js/shell.js js/auth.js js/reset.js js/share.js; do node --check "$f"; done'
    - echo "OK"

# ── Backend tests ───────────────────────────────────────────────────────────
# Spin up the PHP built-in server against a temp SQLite DB, then hit the real
# api/index.php with curl. Lives on the shell runner alongside `lint` -- no
# image needed because PHP is already there.

backend-test:
  stage: test
  needs: [lint]
  script:
    - sh tests/backend/run.sh

# ── End-to-end tests ────────────────────────────────────────────────────────
# Playwright drives Chromium against the same PHP server. Picked up by the
# project-scoped `mbappe-docker-mindmap` runner (docker executor, tag:
# docker). PHP is one apt-get away inside the Playwright image.

e2e-test:
  stage: test
  needs: [lint]
  tags: [docker]
  image: mcr.microsoft.com/playwright:v1.49.0-noble
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 curl
  script:
    - sh tests/e2e/run.sh
  artifacts:
    when: on_failure
    paths:
      - tests/e2e/test-results/
      - tests/e2e/junit.xml
    reports:
      junit: tests/e2e/junit.xml
    expire_in: 1 week

# ── Deploy ──────────────────────────────────────────────────────────────────
# SSH to sebas and git pull in the docroot. Only on main, only when lint AND
# both test stages have passed.
#
# Required CI/CD variables (masked=false):
#   MINDMAP_HOST     : sebas.aukes.com
#   MINDMAP_PATH     : /var/www/mindmap
#   SSH_PRIVATE_KEY  : deploy key authorised for root@sebas

deploy:
  stage: deploy
  needs: [lint, backend-test, e2e-test]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/mindmap_deploy
    - chmod 600 ~/.ssh/mindmap_deploy
    - ssh-keygen -y -f ~/.ssh/mindmap_deploy > /dev/null
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/mindmap_deploy
    - echo "Deploying to root@$MINDMAP_HOST:$MINDMAP_PATH ..."
    - >
      ssh -o StrictHostKeyChecking=no -i ~/.ssh/mindmap_deploy root@$MINDMAP_HOST
      "cd $MINDMAP_PATH && git pull && echo '✓ git pull done'"
    - echo "✓ Deployment complete"
  environment:
    name: production
    url: https://mindmap.apps.aukes.com
